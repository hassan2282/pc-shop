<body class=" font-inter skin-default">

  <div class="loginwrapper">
    <div class="lg-inner-column">
      <div class="right-column relative">
        <div class="inner-content h-full flex flex-col bg-white dark:bg-slate-800">
          <div class="auth-box h-full flex flex-col justify-center">
            <div class="mobile-logo text-center mb-6 lg:hidden block">
              <a href="index.html">
                <img src="assets/images/logo/logo.svg" alt="" class="mb-10 dark_logo">
                <img src="assets/images/logo/logo-white.svg" alt="" class="mb-10 white_logo">
              </a>
            </div>
            <div class="text-center 2xl:mb-10 mb-4">
              <h4 class="font-medium">ورود به سیستم</h4>
              <div class="text-slate-500 dark:text-slate-400 text-base">
                برای شروع استفاده از دش کد به حساب خود وارد شوید
              </div>
            </div>

            <!-- BEGIN: Registration Form -->
            <form class="space-y-4" action='signup-two.html#'>
              <div class="fromGroup">
                <label class="block capitalize form-label">نام</label>
                <div class="relative ">
                  <input type="text" name="name" class="  form-control py-2" placeholder="نام خود را وارد کنید">
                </div>
              </div>
              <div class="fromGroup">
                <label class="block capitalize form-label">ایمیل</label>
                <div class="relative ">
                  <input type="email" name="email" class="  form-control py-2" placeholder="ایمیل خود را وارد کنید">
                </div>
              </div>
              <div class="fromGroup       ">
                <label class="block capitalize form-label  ">رمز عبور</label>
                <div class="relative "><input type="password" name="password" class="  form-control py-2   " placeholder="رمز عبور خود را وارد کنید">
                </div>
              </div>
              <div class="flex justify-between">
                <label class="flex items-center cursor-pointer">
                  <input type="checkbox" class="hiddens">
                  <span class="text-slate-500 dark:text-slate-400 text-sm leading-6 capitalize">شما شرایط و ضوابط و خط مشی رازداری ما را می پذیرید</span>
                </label>
              </div>
              <button class="btn btn-dark block w-full text-center">یک حساب کاربری ایجاد کنید</button>
            </form>
            <!-- END: Registration Form -->
            <div class=" relative border-b-[#9AA2AF] border-opacity-[16%] border-b pt-6">
              <div class=" absolute inline-block bg-white dark:bg-slate-800 left-1/2 top-1/2 transform -translate-x-1/2 px-4 min-w-max
                                    text-sm text-slate-500 dark:text-slate-400font-normal ">یا ادامه دهید</div>
            </div>
            <div class="max-w-[242px] mx-auto mt-8 w-full">

              <!-- BEGIN: Social Log in Area -->
              <ul class="flex">
                <li class="flex-1">
                  <a href="signup-two.html#" class="inline-flex h-10 w-10 bg-[#1C9CEB] text-white text-2xl flex-col items-center justify-center rounded-full">
                    <img src="assets/images/icon/tw.svg" alt="">
                  </a>
                </li>
                <li class="flex-1">
                  <a href="signup-two.html#" class="inline-flex h-10 w-10 bg-[#395599] text-white text-2xl flex-col items-center justify-center rounded-full">
                    <img src="assets/images/icon/fb.svg" alt="">
                  </a>
                </li>
                <li class="flex-1">
                  <a href="signup-two.html#" class="inline-flex h-10 w-10 bg-[#0A63BC] text-white text-2xl flex-col items-center justify-center rounded-full">
                    <img src="assets/images/icon/in.svg" alt="">
                  </a>
                </li>
                <li class="flex-1">
                  <a href="signup-two.html#" class="inline-flex h-10 w-10 bg-[#EA4335] text-white text-2xl flex-col items-center justify-center rounded-full">
                    <img src="assets/images/icon/gp.svg" alt="">
                  </a>
                </li>
              </ul>
              <!-- END: Social Log In Area -->
            </div>
            <div class="md:max-w-[345px] mt-6 mx-auto font-normal text-slate-500 dark:text-slate-400mt-12 uppercase text-sm">
              قبلا ثبت نام کرده اید؟
              <a href="signup-one.html" class="text-slate-900 dark:text-white font-medium hover:underline">ورود به سیستم</a>
            </div>
          </div>
          <div class="auth-footer text-center">
            حق چاپ 2021، دش کد کلیه حقوق محفوظ است.

            </a>
          </div>
          <div>
            <div class="black-500-title max-w-[525px] mx-auto pb-20 text-center">
              شروع کنید
              <span class="text-white font-bold">کارایی بالا</span>
            </div>
          </div>
        </div>
      </div>
